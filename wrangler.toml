# Site da notaX: Worker só de arquivos estáticos (pasta site/).
name = "notax"
compatibility_date = "2026-11-01"
workers_dev = true

# Domínio próprio na zona xunei.com.br (já no Cloudflare). O token precisa de "Workers Routes" + "DNS" da zona.
routes = [{ pattern = "notax.xunei.com.br", custom_domain = true }]

[assets]
directory = "./site"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
