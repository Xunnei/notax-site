# O token do Instagram vale 60 dias. Este botão renova sozinho a cada 15 dias e regrava o segredo IG_TOKEN.
# Precisa do segredo GH_SEGREDOS_TOKEN (token pessoal "fine-grained" só deste repositório, permissão Secrets: Read and write).
name: Renovar token do Instagram
on:
  schedule:
    - cron: '41 9 1,16 * *'
  workflow_dispatch:
permissions: { issues: write }
jobs:
  renovar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Renovar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_SEGREDOS_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          [ -z "$IG_TOKEN" ] && { echo "::notice::IG_TOKEN não configurado."; exit 0; }
          case "$IG_TOKEN" in IG*) ;; *) echo "::notice::Token do usuário do sistema (não vence). Nada a renovar."; exit 0;; esac
          [ -z "$GH_TOKEN" ] && { echo "::error::Falta o segredo GH_SEGREDOS_TOKEN para regravar o token."; exit 1; }
          r=$(curl -fsS "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_TOKEN")
          novo=$(echo "$r" | jq -r '.access_token // empty'); dias=$(( $(echo "$r" | jq -r '.expires_in // 0') / 86400 ))
          [ -z "$novo" ] && { echo "::error::A Meta não devolveu token novo."; exit 1; }
          echo "::add-mask::$novo"
          gh secret set IG_TOKEN --repo "$REPO" --body "$novo"
          echo "✓ token renovado, vale mais $dias dias"
      - name: Avisar falha
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          t="🔑 Renovação do token do Instagram falhou"
          gh issue list --repo "${{ github.repository }}" --state open --search "$t in:title" --json number -q '.[0].number' | grep -q . || \
          gh issue create --repo "${{ github.repository }}" --title "$t" --body "Sem renovar, a postagem automática para quando o token vencer (60 dias). Veja: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
